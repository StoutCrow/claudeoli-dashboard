# Runs on every pull request and every push to main: tests, build, Obsidian's lint rules
# and the mobile-safety check. The ruleset on main requires the job named "test".
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: node scripts/check-mobile.mjs
